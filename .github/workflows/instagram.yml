name: Instagram daily posts

# Times are UTC. IST = UTC + 5:30
on:
  schedule:
    - cron: "30 3 * * *"    # 09:00 IST  -> AI news post
    - cron: "30 12 * * *"   # 18:00 IST  -> tech idea post
    - cron: "30 21 * * 6"   # Sun 03:00 IST -> refresh Instagram token
    # extra random-topic posts: 12 chances a day, the script posts at only EXTRA_PER_DAY of them (random times)
    - cron: "53 2 * * *"    # 08:23 IST
    - cron: "47 4 * * *"    # 10:17 IST
    - cron: "41 5 * * *"    # 11:11 IST
    - cron: "23 6 * * *"    # 11:53 IST
    - cron: "9 7 * * *"    # 12:39 IST
    - cron: "11 8 * * *"    # 13:41 IST
    - cron: "37 9 * * *"    # 15:07 IST
    - cron: "37 10 * * *"    # 16:07 IST
    - cron: "29 11 * * *"    # 16:59 IST
    - cron: "29 13 * * *"    # 18:59 IST
    - cron: "17 14 * * *"    # 19:47 IST
    - cron: "41 15 * * *"    # 21:11 IST
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [news, idea, extra, refresh-token, diagnose, insights]
        default: news
      as_reel:
        description: "Post as a Reel (video) instead of an image"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (do NOT post to Instagram)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN1: ${{ secrets.HF_TOKEN1 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_HANDLE: ${{ vars.IG_HANDLE }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      REELS: ${{ vars.REELS || 'off' }}
      EXTRA_PER_DAY: ${{ vars.EXTRA_PER_DAY || '2' }}
      EXTRA_MIN_GAP: ${{ vars.EXTRA_MIN_GAP || '60' }}
      VOICE_MIX: ${{ vars.VOICE_MIX || 'off' }}
      HINDI_SHARE: ${{ vars.HINDI_SHARE || '0' }}
      POST_LANGUAGE: ${{ vars.POST_LANGUAGE || 'English' }}
      REEL_STYLE: ${{ vars.REEL_STYLE || 'openloop' }}
      REEL_OUTRO: ${{ vars.REEL_OUTRO || 'screen' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest state, not the older commit the run was queued on

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide what to run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
            DRY="${{ inputs.dry_run }}"
            GATE=""
            if [ "${{ inputs.as_reel }}" = "true" ]; then GATE="--reel"; fi
          else
            GATE=""
            DRY=false
            case "${{ github.event.schedule }}" in
              "30 3 * * *")  ACTION=news ;;
              "30 12 * * *") ACTION=idea ;;
              "30 21 * * 6") ACTION=refresh-token ;;
              *)             ACTION=extra; GATE="--gate" ;;
            esac
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"

      - name: Extra-post gate (skipped runs stop here, fast)
        id: gate
        run: |
          if [ "${{ steps.pick.outputs.gate }}" = "--gate" ]; then
            python main.py --gate-check | tee -a "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Devanagari font (Hindi / Marathi)
        if: ${{ steps.gate.outputs.go != 'false' && steps.pick.outputs.action != 'insights' && (vars.POST_LANGUAGE == 'Marathi' || vars.POST_LANGUAGE == 'Hindi' || (vars.HINDI_SHARE != '' && vars.HINDI_SHARE != '0')) }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core libfribidi0 libraqm0
          F=$(fc-list | grep -i "NotoSansDevanagari-Bold" | head -1 | cut -d: -f1)
          echo "FONT_PATH_DEV=$F" >> "$GITHUB_ENV"
          if [ "${{ vars.POST_LANGUAGE }}" = "Marathi" ]; then echo "FONT_PATH=$F" >> "$GITHUB_ENV"; fi

      - name: Install ffmpeg (Reels only)
        if: ${{ steps.gate.outputs.go != 'false' && steps.pick.outputs.action != 'insights' && ((vars.REELS != '' && vars.REELS != 'off') || inputs.as_reel) }}
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - name: Create post
        if: ${{ steps.gate.outputs.go != 'false' && steps.pick.outputs.action != 'refresh-token' && steps.pick.outputs.action != 'diagnose' && steps.pick.outputs.action != 'insights' }}
        run: |
          # Google's free AI is sometimes overloaded: try up to 3 times, 8 minutes apart
          GATEARG="${{ steps.pick.outputs.gate }}"
          [ "$GATEARG" = "--gate" ] && GATEARG=""   # already decided by the gate step
          for TRY in 1 2 3; do
            if [ "${{ steps.pick.outputs.dry }}" = "true" ]; then
              python main.py --slot "${{ steps.pick.outputs.action }}" $GATEARG --dry-run && exit 0
              RC=$?
            else
              python main.py --slot "${{ steps.pick.outputs.action }}" $GATEARG && exit 0
              RC=$?
            fi
            [ "$RC" = "3" ] && exit 3   # Instagram rejected it: do not retry
            echo "attempt $TRY failed"
            [ "$TRY" = "3" ] || sleep 480
          done
          exit 1

      - name: Reel insights report
        if: steps.pick.outputs.action == 'insights'
        run: python main.py --insights

      - name: Diagnose Instagram
        if: steps.pick.outputs.action == 'diagnose'
        run: python main.py --diagnose

      - name: Refresh Instagram token
        if: steps.pick.outputs.action == 'refresh-token'
        env:
          NEW_TOKEN_FILE: new_token.txt
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python main.py --refresh-token
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < new_token.txt
          rm -f new_token.txt token.json
          echo "Token refreshed and saved to repo secret."

      - name: Upload dry-run preview
        if: ${{ steps.pick.outputs.dry == 'true' && steps.pick.outputs.action != 'refresh-token' && steps.pick.outputs.action != 'diagnose' && steps.pick.outputs.action != 'insights' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: output/

      - name: Save state (posted list + log)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json log.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "update state [skip ci]"
            git pull --rebase -X theirs -q || true
            git push
          fi
